name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7b5cff&color_dots=#ebedf0,#e4ffb0,#c8ff3d,#a07cff,#7b5cff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#c8ff3d&color_dots=#1a1714,#2e2a5c,#4b3aa8,#7b5cff,#c8ff3d

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
