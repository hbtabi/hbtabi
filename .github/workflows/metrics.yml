name: Metrics

on:
  schedule:
    - cron: "17 3 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - metrics.svg

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: hbtabi
          filename: metrics.svg
          committer_branch: main
          committer_message: "chore: update metrics.svg [skip ci]"
          template: classic
          config_timezone: Europe/London
          config_display: large
          base: header, activity, community, repositories, metadata
          base_indepth: no

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # habits: disabled, upstream bug (GitHub PushEvent payloads no longer include commits)

          # achievements: disabled, upstream bug (queries the sunset Projects classic API)

          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 12

          plugin_lines: yes

          plugin_notable: yes
