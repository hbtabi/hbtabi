<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Mohammed Hassan bin Tayyeb</title>
  <desc id="d">Founder, Hasenix · AI builder · London</desc>
  <defs>
    <radialGradient id="gP" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7b5cff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#7b5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gL" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c8ff3d" stop-opacity=".35"/>
      <stop offset="1" stop-color="#c8ff3d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#c8ff3d" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#1a1714" stop-opacity="1"/>
      <stop offset=".45" stop-color="#1a1714" stop-opacity=".6"/>
      <stop offset="1" stop-color="#1a1714" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="74" y1="0" x2="434" y2="0">
      <stop offset="0" stop-color="#c8ff3d"/>
      <stop offset="1" stop-color="#7b5cff"/>
    </linearGradient>
    <clipPath id="r"><rect width="1280" height="400" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace; }
    .orbP { animation: drift 9s ease-in-out infinite alternate; transform-origin: 1010px 170px; }
    .orbL { animation: drift2 11s ease-in-out infinite alternate; transform-origin: 860px 300px; }
    .ring  { animation: spin 40s linear infinite; transform-origin: 1010px 200px; }
    .ring2 { animation: spin 26s linear infinite reverse; transform-origin: 1010px 200px; }
    .in1 { opacity: 0; animation: up .9s cubic-bezier(.2,.7,.2,1) .1s forwards; }
    .in2 { opacity: 0; animation: up .9s cubic-bezier(.2,.7,.2,1) .35s forwards; }
    .in3 { opacity: 0; animation: up .9s cubic-bezier(.2,.7,.2,1) .6s forwards; }
    .bar { stroke-dasharray: 360; stroke-dashoffset: 360; animation: draw 1.2s ease-out .8s forwards; }
    .dot { animation: blink 1.6s steps(1) infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 82px 106px; }
    @keyframes drift  { from { transform: translate(0,0) scale(1); } to { transform: translate(-40px,20px) scale(1.15); } }
    @keyframes drift2 { from { transform: translate(0,0) scale(1); } to { transform: translate(50px,-25px) scale(.9); } }
    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes up     { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes draw   { to { stroke-dashoffset: 0; } }
    @keyframes blink  { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
    @keyframes pulse  { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: .35; } }
  </style>

  <g clip-path="url(#r)">
    <rect width="1280" height="400" fill="#1a1714"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <circle class="orbP" cx="1010" cy="170" r="300" fill="url(#gP)"/>
    <circle class="orbL" cx="860" cy="300" r="220" fill="url(#gL)"/>
    <g class="ring" fill="none">
      <circle cx="1010" cy="200" r="150" stroke="#c8ff3d" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="4 10"/>
      <circle cx="1160" cy="200" r="6" fill="#c8ff3d"/>
    </g>
    <g class="ring2" fill="none">
      <circle cx="1010" cy="200" r="96" stroke="#7b5cff" stroke-width="2"/>
      <circle cx="914" cy="200" r="5" fill="#7b5cff"/>
    </g>
    <text x="1010" y="214" text-anchor="middle" class="mono" font-size="38" font-weight="700" fill="#c8ff3d" opacity=".9">H/X</text>
    <rect width="1280" height="400" fill="url(#fade)"/>

    <!-- kicker -->
    <g class="in1">
      <circle class="pulse" cx="82" cy="106" r="5" fill="#c8ff3d"/>
      <circle cx="82" cy="106" r="5" fill="#c8ff3d"/>
      <text x="98" y="111" class="mono" font-size="15" letter-spacing="3" fill="#c8ff3d">NOW BUILDING · HASENIX.COM</text>
    </g>
    <!-- name -->
    <g class="in2">
      <text x="72" y="200" class="sans" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Mohammed Hassan</text>
      <text x="72" y="266" class="sans" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-1.5">bin Tayyeb<tspan fill="#c8ff3d">.</tspan></text>
    </g>
    <path class="bar" d="M74 292H434" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
    <!-- tagline -->
    <g class="in3">
      <text x="72" y="334" class="sans" font-size="24" fill="#e9e5dc">Founder, <tspan fill="#c8ff3d" font-weight="700">Hasenix</tspan> <tspan fill="#7b5cff">·</tspan> AI builder <tspan fill="#7b5cff">·</tspan> London<tspan class="dot" fill="#c8ff3d"> ▌</tspan></text>
    </g>
  </g>
</svg>
